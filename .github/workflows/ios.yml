name: iOS

on:
  push:
    branches: [ios]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS arm64 (unsigned IPA)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install tools
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install ninja ccache nasm glslang
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: ios-deps-${{ hashFiles('cpmfile.json', '.github/workflows/ios.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-deps-${{ hashFiles('cpmfile.json', '.github/workflows/ios.yml') }}-
            ios-deps-

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPMUTIL_FORCE_BUNDLED=ON \
            -DENABLE_QT=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_LSFG=OFF \
            -DENABLE_RESHADE=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WERROR=OFF \
            -DYUZU_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DDYNARMIC_TESTS=OFF \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_SIRIT=ON \
            -DYUZU_USE_BUNDLED_OPENSSL=OFF \
            -DOPENSSL_TARGET_PLATFORM=ios64-xcrun \
            -DYUZU_USE_BUNDLED_MOLTENVK=ON \
            -DLICHII_BUILD_TAG=ios-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=ios-arm64

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --target yuzu-cmd --parallel
          ccache -s

      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/bin/Lichii.app
          test -x "$app/Lichii"
          test -f "$app/Frameworks/MoltenVK.framework/MoltenVK"
          ls -la "$app" "$app/Frameworks"
          rm -rf Payload && mkdir Payload
          cp -R "$app" Payload/
          cp dist/ios/Lichii.entitlements Lichii.entitlements
          /usr/bin/zip -qry Lichii.ipa Payload
          ls -la Lichii.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-iOS-unsigned-${{ github.run_number }}
          path: |
            Lichii.ipa
            Lichii.entitlements
          if-no-files-found: error

      - name: Upload configure log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ github.run_number }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore

      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ios-latest
          notes="Unsigned iOS build of Lichii (yuzu-cmd SDL3 frontend) from ${GITHUB_SHA}. Sign with Lichii.entitlements (JIT, increased memory limit, extended virtual addressing) and install with SideStore or your own profile."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Lichii.ipa Lichii.entitlements --clobber
            gh release edit "$tag" --notes "$notes" --prerelease
          else
            gh release create "$tag" Lichii.ipa Lichii.entitlements --title "iOS (latest)" --notes "$notes" --prerelease
          fi
